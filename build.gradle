plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.21'
}

version = project.mod_version
group = 'com.github.thedeathlycow'
base { archivesName = 'more-geodes-fabric-26.3' }

repositories {
    mavenCentral()
    exclusiveContent {
        forRepository { maven { url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // Optional at runtime, as in upstream. No Carpet code is bundled.
    compileOnly 'maven.modrinth:carpet:yt9oDFOj'
    if (project.hasProperty('withCarpet')) {
        runtimeOnly 'maven.modrinth:carpet:yt9oDFOj'
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach { options.release = 25 }
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar {
    from('LICENSE') { rename { 'LICENSE_more-geodes' } }
    from('COPYING')
}

// Test-only code is compiled and launched explicitly; the release JAR contains
// only src/main. The integration tests create and modify isolated test worlds.
sourceSets {
    testmod {
        compileClasspath += sourceSets.main.compileClasspath + sourceSets.main.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.main.output
    }
}
loom {
    mods {
        geodes { sourceSet sourceSets.main }
        'geodes-test' { sourceSet sourceSets.testmod }
    }
    runs {
        server { programArg 'nogui' }
        testmodServer {
            server()
            source sourceSets.testmod
            runDir 'run/test-server'
        }
        testmodClient {
            client()
            source sourceSets.testmod
            runDir 'run/test-client'
            programArgs '--username', 'GeodesQA', '--width', '1280', '--height', '800'
        }
    }
    if (project.hasProperty('keepTestServer')) {
        runs.testmodServer.property 'geodes.tests.keepOpen', 'true'
    }
}
tasks.register('testmodJar', Jar) {
    dependsOn tasks.named('testmodClasses')
    archiveClassifier = 'testmod'
    from sourceSets.testmod.output
}
